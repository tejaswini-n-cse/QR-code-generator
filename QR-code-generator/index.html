<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔳</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="card">
    <h1>🔳 QR Code Generator</h1>
    <p class="subtitle">Turn any text or link into a QR code.</p>

    <label for="text-input">Text or URL</label>
    <textarea id="text-input" rows="3" maxlength="500" placeholder="https://example.com"></textarea>
    <div class="char-count"><span id="char-count">0</span> / 500</div>

    <div class="options">
      <div class="option-group">
        <label for="size-select">Size</label>
        <select id="size-select">
          <option value="200">Small (200px)</option>
          <option value="256" selected>Medium (256px)</option>
          <option value="320">Large (320px)</option>
        </select>
      </div>

      <div class="option-group">
        <label for="level-select">Error correction</label>
        <select id="level-select">
          <option value="L">Low</option>
          <option value="M" selected>Medium</option>
          <option value="Q">Quartile</option>
          <option value="H">High</option>
        </select>
      </div>

      <div class="option-group">
        <label for="fg-color">QR color</label>
        <input type="color" id="fg-color" value="#000000">
      </div>

      <div class="option-group">
        <label for="bg-color">Background</label>
        <input type="color" id="bg-color" value="#ffffff">
      </div>
    </div>

    <button id="generate-btn" class="btn">Generate QR Code</button>
    <p id="error" class="error" role="alert"></p>

    <section id="output" class="output hidden">
      <div id="qr-box" class="qr-box"></div>
      <button id="download-btn" class="btn secondary">⬇ Download PNG</button>
    </section>

    <p class="hint">Tip: press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to generate.</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
